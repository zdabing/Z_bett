name: Build OpenWrt 25 packages

# 仅手动触发（Actions 页面点 Run workflow）。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a stable APK update release after successful checks/builds
        type: boolean
        default: false
      release_tag:
        description: New release tag (vX.Y.Z or vX.Y.Z-rN), required when publishing
        type: string
        required: false

permissions:
  contents: read

jobs:
  rust-check:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate requested release tag
        if: inputs.publish
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/release.py validate-tag "$RELEASE_TAG"
      - name: Check router shell syntax
        run: |
          sh -n bettbox/files/usr/bin/bettbox
          sh -n bettbox/files/etc/init.d/bettbox
          sh -n bettbox/files/usr/libexec/bettbox/cron.sh
          sh -n bettbox/files/usr/libexec/bettbox/router-settings.sh
          for script in bettbox/files/usr/libexec/bettbox/*.sh; do sh -n "$script" || exit 1; done
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path bettbox/forge/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path bettbox/forge/Cargo.toml

  build:
    name: SDK ${{ matrix.target }} (.apk)
    runs-on: ubuntu-latest
    needs: rust-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            sdk_dir: targets/x86/64
          - target: aarch64_generic
            sdk_dir: targets/armsr/armv8
    steps:
      - uses: actions/checkout@v4
        with:
          path: bettbox-feed

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget zstd curl

      - name: Download OpenWrt 25.12 SDK
        working-directory: ${{ github.workspace }}
        run: |
          VER=25.12.6
          DIR=${{ matrix.sdk_dir }}
          # Resolve the exact SDK filename from sha256sums (fixed-name fetch, no
          # directory listing needed — listings 502 on the CDN intermittently)
          # and fall back across mirrors.
          for M in https://downloads.openwrt.org \
                   https://mirrors.tuna.tsinghua.edu.cn/openwrt \
                   https://mirror.nju.edu.cn/openwrt; do
            LINE=$(curl -sL --fail -m 60 "$M/releases/$VER/$DIR/sha256sums" | grep 'openwrt-sdk-' | head -1) || LINE=""
            [ -n "$LINE" ] || continue
            SDK=$(echo "$LINE" | awk '{print $2}' | sed 's/^\*//')
            HASH=$(echo "$LINE" | awk '{print $1}')
            echo "SDK: $SDK (mirror $M)"
            if curl -sL --fail -m 900 "$M/releases/$VER/$DIR/$SDK" -o sdk.tar.zst \
               && echo "$HASH  sdk.tar.zst" | sha256sum -c -; then
              break
            fi
            rm -f sdk.tar.zst
          done
          [ -f sdk.tar.zst ] || { echo "all mirrors failed"; exit 1; }
          tar axf sdk.tar.zst
          SDKDIR=$(echo openwrt-sdk-*)
          echo "SDKDIR=$SDKDIR" >> "$GITHUB_ENV"

      - name: Register feed and install
        working-directory: ${{ env.SDKDIR }}
        run: |
          # Creating feeds.conf with only our feed disables the SDK defaults.
          # Keep the SDK-pinned base/packages/luci feeds and their toolchains.
          cp feeds.conf.default feeds.conf
          echo "src-link bettbox $GITHUB_WORKSPACE/bettbox-feed" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        working-directory: ${{ env.SDKDIR }}
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-bettbox=y" >> .config
          echo "CONFIG_PACKAGE_bettbox=y" >> .config
          make defconfig

      - name: Build native ucode validator
        working-directory: ${{ env.SDKDIR }}
        run: make package/ucode/host/compile V=s -j2

      - name: Validate router ucode syntax
        working-directory: ${{ env.SDKDIR }}
        run: |
          mkdir -p ucode-checks
          SOURCE_ROOT="$GITHUB_WORKSPACE/bettbox-feed"
          for source in "$SOURCE_ROOT"/bettbox/files/usr/libexec/bettbox/*.uc \
                        "$SOURCE_ROOT"/luci-app-bettbox/root/usr/share/rpcd/ucode/bettbox.uc; do
            printf 'Checking %s\n' "$source"
            staging_dir/hostpkg/bin/ucode -cno-interp,dynlink=fs,dynlink=uci \
              -o "ucode-checks/$(basename "$source").ucb" "$source"
          done

      - name: Build packages
        working-directory: ${{ env.SDKDIR }}
        run: |
          make package/bettbox/compile V=s -j2 || exit 1
          make package/luci-app-bettbox/compile V=s -j2 || exit 1

      - name: Collect artifacts
        working-directory: ${{ env.SDKDIR }}
        run: |
          mkdir -p out
          find bin/packages -type f \( -name 'bettbox-[0-9]*.apk' -o -name 'luci-app-bettbox-[0-9]*.apk' \) -exec cp {} out/ \;
          ls -la out/

      - name: Verify APK metadata and prepare update assets
        working-directory: ${{ env.SDKDIR }}
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          export LD_LIBRARY_PATH="$PWD/staging_dir/host/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python3 "$GITHUB_WORKSPACE/bettbox-feed/.github/scripts/release.py" collect \
            --target "$PACKAGE_TARGET" --apk-tool "$PWD/staging_dir/host/bin/apk" \
            --input out --output release-out

      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-${{ matrix.target }}
          path: ${{ env.SDKDIR }}/release-out/

  release:
    name: Publish verified APK update feed
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: openwrt-25.12-*
          path: artifacts
      - name: Assemble matching architecture releases
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 .github/scripts/release.py assemble --tag "$RELEASE_TAG" --input artifacts --output release-assets
      - name: Publish after GitHub checksum verification
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/release.py publish --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --repository "$RELEASE_REPOSITORY" --input release-assets
