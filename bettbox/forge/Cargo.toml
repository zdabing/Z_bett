[package]
name = "bettbox-forge"
version = "1.19.7"
edition = "2021"
description = "Bettbox JS override helper (upstream rquickjs/QuickJS sandbox)"
license = "GPL-3.0"

[dependencies]
rquickjs = { version = "=0.12.0", default-features = false }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"
